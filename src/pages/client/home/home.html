<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Store - Catálogo</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 0; background: #fafafa; color: #222; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background: #1f1f1f;
            color: white;
        }

        header nav a, header button {
            color: white;
            background: #333;
            border: 1px solid #555;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            font-size: 0.9rem;
            margin-left: 0.5rem;
        }

        .layout {
            display: flex;
            gap: 1.5rem;
            padding: 1.5rem;
            align-items: flex-start;
        }

        aside {
            width: 200px;
            flex-shrink: 0;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 1rem;
        }

        aside h2 { font-size: 1rem; margin-top: 0; }

        #listaCategorias { list-style: none; padding: 0; margin: 0; }
        #listaCategorias li { margin-bottom: 0.4rem; }

        #listaCategorias button {
            width: 100%;
            text-align: left;
            padding: 0.5rem;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        #listaCategorias button:hover { background: #f0f0f0; }
        #listaCategorias button.activa { background: #ffe0b2; font-weight: bold; }

        main { flex: 1; }

        #buscador {
            width: 100%;
            padding: 0.7rem;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 1.2rem;
        }

        #grillaProductos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1rem;
        }

        .tarjeta-producto {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .tarjeta-producto img {
            width: 100%;
            height: 130px;
            object-fit: cover;
        }

        .tarjeta-producto .info {
            padding: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            flex: 1;
        }

        .tarjeta-producto .categoria {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
        }

        .tarjeta-producto .precio { font-weight: bold; }

        .tarjeta-producto button {
            margin-top: auto;
            padding: 0.5rem;
            background: #1f8a4c;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .tarjeta-producto button:hover { background: #166a3a; }

        #sinResultados {
            text-align: center;
            color: #888;
            padding: 2rem;
            display: none;
        }
    </style>
</head>

<body>
    <header>
        <h1 style="font-size: 1.2rem; margin: 0;">🍔 Food Store</h1>
        <nav>
            <a href="../cart/cart.html">Ver carrito 🛒</a>
            <button id="logoutButton">Salir</button>
        </nav>
    </header>

    <div class="layout">
        <aside>
            <h2>Categorías</h2>
            <ul id="listaCategorias">
                <!-- Las <li> se arman dinámicamente en home.ts con getCategories() -->
            </ul>
        </aside>

        <main>
            <input type="text" id="buscador" placeholder="Buscar producto por nombre...">

            <div id="grillaProductos">
                <!-- Las tarjetas de producto se arman dinámicamente en home.ts -->
            </div>

            <p id="sinResultados">No se encontraron productos que coincidan con tu búsqueda.</p>
        </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="./home.ts"></script>
</body>

</html>
